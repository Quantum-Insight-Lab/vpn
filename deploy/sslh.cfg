verbose: 0;
foreground: false;
inetd: false;
numeric: true;
transparent: false;
timeout: 5;
user: "nobody";
pidfile: "/run/sslh.pid";

listen:
(
    { host: "0.0.0.0"; port: "443"; },
    { host: "::"; port: "443"; }
);

protocols:
(
    { name: "tls";    host: "127.0.0.1"; port: "10440"; },
    { name: "socks5"; host: "127.0.0.1"; port: "12080"; },
    { name: "http";   host: "127.0.0.1"; port: "12081"; },
    { name: "anyprot"; host: "127.0.0.1"; port: "10440"; }
);
